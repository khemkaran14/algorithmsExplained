name: CI
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: algoverse
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: algoverse
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U algoverse" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://algoverse:ci-only@localhost:5432/algoverse
      AUTH_SECRET: ci-only-not-for-production-000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:security
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:check:dsa
      - run: pnpm content:check:system-design
      - run: pnpm content:check:databases
      - run: pnpm content:check:ready
      - run: pnpm content:free-ratio
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
