services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: algoverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: algoverse
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U algoverse']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    profiles: ['app']
    build: .
    ports: ['3000:3000']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://algoverse:${POSTGRES_PASSWORD}@postgres:5432/algoverse
      RATE_LIMIT_MODE: ${RATE_LIMIT_MODE:-shared}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres_data:
